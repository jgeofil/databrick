# The main pipeline for default_py

resources:
  pipelines:
    default_py_etl:
      name: default_py_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/default_py_etl"

      libraries:
        - glob:
            include: ../src/default_py_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}

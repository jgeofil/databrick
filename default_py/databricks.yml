# This is a Declarative Automation Bundle definition for default_py.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: default_py
  uuid: 97367c27-7c62-45a5-abc5-1964a37f2b0e

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-e4419c7a-65f4.cloud.databricks.com
    variables:
      catalog: default-cat
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-e4419c7a-65f4.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/admin@jeremygf.com to make sure we only have a single copy.
      root_path: /Workspace/Users/admin@jeremygf.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: default-cat
      schema: prod
    permissions:
      - user_name: admin@jeremygf.com
        level: CAN_MANAGE
